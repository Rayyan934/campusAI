services:

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app

  ai_engine:
    build: ./ai_engine
    ports:
      - "8001:8001"
    env_file:
      - ./ai_engine/.env
    volumes:
      - ./ai_engine:/app

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
      - NEXT_PUBLIC_AI_ENGINE_URL=http://localhost:8001
    volumes:
      - ./frontend:/app
      - /app/node_modules
